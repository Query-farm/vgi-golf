[project]
name = "vgi-golf"
version = "0.3.0"
description = "A read-only VGI worker exposing professional golf leaderboards, schedules, statistics and world rankings to Haybarn SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "golf", "pga-tour", "leaderboard", "owgr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
requires-python = ">=3.14"
dependencies = [
    "vgi-python[http]>=0.55.1,<0.56",
    "httpx>=0.27,<1",
    "pyarrow>=18,<26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6,<8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://github.com/Query-farm/vgi-golf#readme"
Repository = "https://github.com/Query-farm/vgi-golf"
Issues = "https://github.com/Query-farm/vgi-golf/issues"

[project.optional-dependencies]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`):
# `http` so the container can serve `--http` (/health + VGI RPC), plus `oauth`
# (JWT verification) so the image can run in Orchard hosted mode
# (`VGI_ORCHARD_HOSTED=1` with VGI_JWT_ISSUER/AUDIENCE/JWKS_URI and VGI_SIGNING_KEY).
serve = [
    "vgi-python[http,oauth]>=0.55.1,<0.56",
]

[project.scripts]
vgi-golf = "vgi_golf.worker:main"
vgi-golf-http = "vgi_golf.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_golf"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the public ESPN golf and OWGR endpoints"]
